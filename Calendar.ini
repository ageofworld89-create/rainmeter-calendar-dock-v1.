[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[MeasureLua]
Measure=Script
ScriptFile=#CURRENTPATH#Calendar.lua

[BG]
Meter=Shape
Shape=Rectangle 0,0,210,252,22 | Fill Color 43,43,43,245 | StrokeWidth 0
Shape2=Rectangle 68,236,74,4,2 | Fill Color 255,255,255,235 | StrokeWidth 0

[Title]
Meter=String
MeasureName=MeasureLua
Text=[&MeasureLua:Title()]
DynamicVariables=1
X=105
Y=14
StringAlign=Center
FontFace=Segoe UI
FontSize=17
FontWeight=700
FontColor=255,255,255
AntiAlias=1

[Line]
Meter=Shape
Shape=Rectangle 32,46,146,3,1.5 | Fill Color 255,255,255,240 | StrokeWidth 0

[Prev]
Meter=Shape
X=10
Y=12
Shape=Rectangle 0,0,26,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path P | Fill Color 120,120,120 | StrokeWidth 0
P=MoveTo 8,12 | LineTo 16,6 | LineTo 16,18 | ClosePath 1
MouseOverAction=[!SetOption Prev Shape2 "Path P | Fill Color 255,255,255 | StrokeWidth 0"][!UpdateMeter Prev][!Redraw]
MouseLeaveAction=[!SetOption Prev Shape2 "Path P | Fill Color 120,120,120 | StrokeWidth 0"][!UpdateMeter Prev][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureLua "Move(-1)"]

[Next]
Meter=Shape
X=174
Y=12
Shape=Rectangle 0,0,26,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path P | Fill Color 120,120,120 | StrokeWidth 0
P=MoveTo 10,6 | LineTo 18,12 | LineTo 10,18 | ClosePath 1
MouseOverAction=[!SetOption Next Shape2 "Path P | Fill Color 255,255,255 | StrokeWidth 0"][!UpdateMeter Next][!Redraw]
MouseLeaveAction=[!SetOption Next Shape2 "Path P | Fill Color 120,120,120 | StrokeWidth 0"][!UpdateMeter Next][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureLua "Move(1)"]

